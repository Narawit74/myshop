{% extends 'shop/base.html' %}

{% block content %}
  <div class="container my-5">
    <form method="post" class="bg-white p-4 rounded shadow-sm">
      {% csrf_token %}
      
      <div class="form-group mb-3">
        <label for="id_name" class="form-label">ชื่อหมวดหมู่</label>
        {{ form.name }}
      </div>

      <div class="form-group mb-3">
        <label for="id_description" class="form-label">รายละเอียด</label>
        {{ form.description }}
      </div>

      <button type="submit" class="btn btn-primary btn-sm">
        <i class="bi bi-plus-circle"></i> เพิ่มหมวดหมู่
      </button>
    </form>

    <div class="mb-3 text-start mt-4">
      <a href="{% url 'shop:admin_add_product' %}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left-circle"></i> กลับ
      </a>
    </div>
  </div>
{% endblock %}
