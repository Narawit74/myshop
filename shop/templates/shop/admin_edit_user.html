{% extends 'shop/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <form method="post">
                {% csrf_token %}
                <div class="form-group mb-3">
                    <label for="first_name"><i class="fas fa-user"></i> ชื่อ:</label>
                    <input type="text" name="first_name" id="first_name" class="form-control rounded-3" value="{{ user.first_name }}">
                </div>
                <div class="form-group mb-3">
                    <label for="last_name"><i class="fas fa-user"></i> นามสกุล:</label>
                    <input type="text" name="last_name" id="last_name" class="form-control rounded-3" value="{{ user.last_name }}">
                </div>
                <div class="form-group mb-3">
                    <label for="email"><i class="fas fa-envelope"></i> อีเมล:</label>
                    <input type="email" name="email" id="email" class="form-control rounded-3" value="{{ user.email }}">
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-sm rounded-3">
                    <i class="fas fa-save"></i> บันทึกการเปลี่ยนแปลง
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
